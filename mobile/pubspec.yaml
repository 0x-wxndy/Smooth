name: smooth_app
description: Samooth — learning & freelance ecosystem prototype.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.3
  intl: ^0.20.1
  equatable: ^2.0.7
  flutter_animate: ^4.5.2
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  crypto: ^3.0.6
  sqflite_common_ffi: ^2.3.4+4
  video_player: ^2.10.1
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/smooth_logo.png
  adaptive_icon_background: assets/branding/icon_bg_transparent.png
  adaptive_icon_foreground: assets/branding/smooth_logo.png
  remove_alpha_ios: false
  web:
    generate: true
    image_path: assets/branding/smooth_logo.png
    background_color: "#00000000"
  windows:
    generate: true
    image_path: assets/branding/smooth_logo.png
  macos:
    generate: true
    image_path: assets/branding/smooth_logo.png

flutter_native_splash:
  color: "#000000"
  image: assets/branding/smooth_logo.png
  android_12:
    color: "#000000"
    image: assets/branding/smooth_logo.png

flutter:
  uses-material-design: true
  assets:
    - videos/
    - assets/branding/
